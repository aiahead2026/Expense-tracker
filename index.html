<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ExpenseTracker">
  <meta name="theme-color" content="#171925">
  <title>ExpenseTracker</title>
  <style>
    :root {
      --primary: #9366ff;
      --primary-dark: #7247d9;
      --bg-primary: #171925;
      --bg-secondary: #242b3a;
      --bg-tertiary: #2d3647;
      --text-primary: #ffffff;
      --text-secondary: #a8aec0;
      --border: #3d4655;
      --success: #34c759;
      --danger: #ff453a;
      --warning: #ff9500;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.5;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-primary);
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 600;
    }

    .month-selector {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
    }

    .month-selector:focus {
      outline: none;
      border-color: var(--primary);
    }

    nav {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 0 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 0;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--primary);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .total-amount {
      font-size: 42px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      text-align: center;
    }

    .pie-chart-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
    }

    .category-selector {
      margin-bottom: 16px;
    }

    .category-selector select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
    }

    .store-bar {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .store-label {
      min-width: 80px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }

    .bar-value {
      font-size: 11px;
      color: white;
      font-weight: 600;
    }

    .bar-percent {
      min-width: 45px;
      text-align: right;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-pill {
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
    }

    .form-input:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    .warning-banner {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-left: 4px solid var(--warning);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      display: none;
    }

    .warning-banner.show {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 500;
    }

    .modal-overlay.active {
      display: block;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 600;
      overflow-y: auto;
      display: none;
    }

    .modal.active {
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
    }

    .expenses-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .expense-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .expense-info {
      flex: 1;
    }

    .expense-store {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .expense-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .expense-amount {
      font-weight: 600;
      color: var(--primary);
      font-size: 16px;
      margin-right: 12px;
    }

    .expense-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .category-name {
      flex: 1;
      font-weight: 600;
    }

    .category-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .category-actions {
      display: flex;
      gap: 8px;
      margin-left: 12px;
    }

    .add-category-group {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .add-category-group input {
      flex: 1;
    }

    .add-category-group button {
      padding: 10px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-top">
        <div class="logo-group">
          <div class="logo-icon">💰</div>
          <div class="logo-text">ExpenseTracker</div>
        </div>
      </div>
      <select class="month-selector" id="monthSelector"></select>
    </header>

    <nav>
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="expense">New expense</button>
    </nav>

    <main>
      <!-- DASHBOARD -->
      <div class="tab-content active" id="dashboardTab">
        <div class="card">
          <h2 class="card-title">Monthly summary</h2>
          <div class="total-amount" id="totalAmount">$0.00</div>
          <div class="pie-chart-container">
            <canvas id="pieChart"></canvas>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Category breakdown</h2>
          <div class="category-selector">
            <select id="categoryBreakdownSelect"></select>
          </div>
          <div id="categoryBars"></div>
        </div>

        <div class="action-buttons">
          <button class="btn-pill" id="allExpensesBtn">All expenses</button>
          <button class="btn-pill" id="manageCategoriesBtn">Manage categories</button>
        </div>
      </div>

      <!-- NEW EXPENSE -->
      <div class="tab-content" id="expenseTab">
        <div class="card">
          <h2 class="card-title">New expense</h2>
          
          <div class="warning-banner" id="dateWarning">
            🔒 You can only add expenses for the current month or up to 3 months prior.
          </div>

          <form id="expenseForm">
            <div class="form-group">
              <label class="form-label">Date</label>
              <input type="date" class="form-input" id="expenseDate" required>
            </div>

            <div class="form-group">
              <label class="form-label">Category</label>
              <select class="form-select" id="expenseCategory" required>
                <option value="">Select…</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Amount</label>
              <input type="number" class="form-input" id="expenseAmount" placeholder="0.00" step="0.01" required>
            </div>

            <div class="form-group">
              <label class="form-label">Store/Business</label>
              <input type="text" class="form-input" id="expenseStore" placeholder="Where did you shop?" required>
            </div>

            <button type="submit" class="submit-btn">Add expense</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal" id="allExpensesModal">
    <div class="modal-header">
      <h2 class="modal-title">All expenses</h2>
      <button class="close-btn" id="closeAllExpensesBtn">✕</button>
    </div>
    <div class="modal-content">
      <div class="expenses-list" id="expensesList"></div>
    </div>
  </div>

  <div class="modal" id="manageCategoriesModal">
    <div class="modal-header">
      <h2 class="modal-title">Manage categories</h2>
      <button class="close-btn" id="closeCategoriesBtn">✕</button>
    </div>
    <div class="modal-content">
      <div id="categoriesList"></div>
      <div class="add-category-group">
        <input type="text" class="form-input" id="newCategoryInput" placeholder="New category name">
        <button id="addCategoryBtn">Add</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    const SUPABASE_URL = 'https://drszqxwyyyyppajcqktp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyc3pxeHd5eXlwcGFqY3FrdHAiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcwNjI3OTk3OCwiZXhwIjoxODYzOTQ3OTc4fQ.n-Hmp_c7wQmR3S6lBh_q3hXR00Yl6O9hTMW4Ss85Z3o';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMonth = new Date();
    let selectedMonth = new Date();
    let pieChart = null;

    // ===== NEW: 3-MONTH BACKDATE HELPERS =====
    function getMonthKey(date) {
      return date.toISOString().slice(0, 7);
    }

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    function canEditMonth(date) {
      const today = new Date();
      const threeMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 3, today.getDate());
      return date >= threeMonthsAgo && date <= today;
    }

    // ===== NEW: POPULATE MONTH SELECTOR (current + 3 back) =====
    const monthSelector = document.getElementById('monthSelector');

    function populateMonthSelector() {
      monthSelector.innerHTML = '';
      const today = new Date();
      const allowedDate = new Date(today.getFullYear(), today.getMonth() - 3, 1);

      for (let i = 0; i <= 3; i++) {
        const date = new Date(today.getFullYear(), today.getMonth() - i, 1);
        if (date >= allowedDate) {
          const option = document.createElement('option');
          option.value = getMonthKey(date);
          option.textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
          if (i === 0) option.selected = true;
          monthSelector.appendChild(option);
        }
      }
    }

    monthSelector.addEventListener('change', (e) => {
      const [year, month] = e.target.value.split('-').map(Number);
      selectedMonth = new Date(year, month - 1, 1);
      refreshDashboard();
      updateExpenseForm();
    });

    // ===== NEW: UPDATE FORM BASED ON SELECTED MONTH =====
    const expenseForm = document.getElementById('expenseForm');
    const expenseDate = document.getElementById('expenseDate');
    const dateWarning = document.getElementById('dateWarning');

    function updateExpenseForm() {
      const canEdit = canEditMonth(selectedMonth);
      expenseForm.style.display = canEdit ? 'block' : 'none';
      dateWarning.classList.toggle('show', !canEdit);
      
      if (canEdit) {
        expenseDate.value = formatDate(selectedMonth);
      }
    }

    // Validate date changes
    expenseDate.addEventListener('change', (e) => {
      const selectedDate = new Date(e.target.value);
      if (!canEditMonth(selectedDate)) {
        e.target.value = formatDate(selectedMonth);
      }
    });

    // ===== ORIGINAL CODE BELOW (unchanged) =====
    async function withRetry(fn, maxAttempts = 3) {
      for (let i = 0; i < maxAttempts; i++) {
        try {
          return await fn();
        } catch (error) {
          if (i === maxAttempts - 1) throw error;
          await new Promise(r => setTimeout(r, Math.pow(2, i) * 100));
        }
      }
    }

    async function loadCategories() {
      try {
        const { data } = await withRetry(() =>
          supabase.from('categories').select('*').order('name')
        );

        document.getElementById('expenseCategory').innerHTML = '<option value="">Select…</option>';
        document.getElementById('categoryBreakdownSelect').innerHTML = '';

        (data || []).forEach(cat => {
          const opt1 = document.createElement('option');
          opt1.value = cat.name;
          opt1.textContent = cat.name;
          document.getElementById('expenseCategory').appendChild(opt1);

          const opt2 = document.createElement('option');
          opt2.value = cat.name;
          opt2.textContent = cat.name;
          document.getElementById('categoryBreakdownSelect').appendChild(opt2);
        });

        if (data && data.length > 0) {
          document.getElementById('categoryBreakdownSelect').value = data[0].name;
        }
      } catch (error) {
        console.error('Error loading categories:', error);
      }
    }

    async function loadExpenses() {
      try {
        const monthKey = getMonthKey(selectedMonth);
        const { data } = await withRetry(() =>
          supabase
            .from('expenses')
            .select('*')
            .ilike('date', monthKey + '%')
            .order('date', { ascending: false })
        );

        return data || [];
      } catch (error) {
        console.error('Error loading expenses:', error);
        return [];
      }
    }

    async function refreshDashboard() {
      try {
        const expenses = await loadExpenses();
        
        const total = expenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
        document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;

        const byCategory = {};
        expenses.forEach(e => {
          byCategory[e.category] = (byCategory[e.category] || 0) + parseFloat(e.amount);
        });

        const ctx = document.getElementById('pieChart').getContext('2d');
        
        if (pieChart) pieChart.destroy();

        if (Object.keys(byCategory).length === 0) {
          ctx.clearRect(0, 0, 300, 300);
          document.getElementById('categoryBars').innerHTML = '<div class="empty-state">No expenses in this category for this month.</div>';
        } else {
          pieChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: Object.keys(byCategory),
              datasets: [{
                data: Object.values(byCategory),
                backgroundColor: ['#9366ff', '#7247d9', '#a77ef0', '#82ffff', '#00d4ff', '#00b8e6', '#34c759', '#30b0c0', '#ff9500', '#ff453a'],
                borderColor: '#242b3a',
                borderWidth: 2,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: {
                  position: 'right',
                  labels: { color: '#a8aec0', font: { size: 12 }, padding: 12, usePointStyle: true }
                }
              }
            }
          });

          updateCategoryBreakdown(expenses);
        }
      } catch (error) {
        console.error('Error refreshing dashboard:', error);
      }
    }

    function updateCategoryBreakdown(expenses) {
      const selectedCategory = document.getElementById('categoryBreakdownSelect').value;
      const categoryExpenses = expenses.filter(e => e.category === selectedCategory);

      if (categoryExpenses.length === 0) {
        document.getElementById('categoryBars').innerHTML = '<div class="empty-state">No expenses in this category for this month.</div>';
        return;
      }

      const byStore = {};
      categoryExpenses.forEach(e => {
        byStore[e.store] = (byStore[e.store] || 0) + parseFloat(e.amount);
      });

      const total = Object.values(byStore).reduce((a, b) => a + b, 0);
      const stores = Object.entries(byStore).sort((a, b) => b[1] - a[1]);

      document.getElementById('categoryBars').innerHTML = stores.map(([store, amount]) => {
        const percent = ((amount / total) * 100).toFixed(0);
        const maxWidth = (amount / Math.max(...Object.values(byStore))) * 50;
        return `<div class="store-bar"><div class="store-label">${store}</div><div class="bar-track"><div class="bar-fill" style="width: ${maxWidth}%;"><div class="bar-value">$${amount.toFixed(2)}</div></div></div><div class="bar-percent">${percent}%</div></div>`;
      }).join('');
    }

    document.getElementById('categoryBreakdownSelect').addEventListener('change', async () => {
      const expenses = await loadExpenses();
      updateCategoryBreakdown(expenses);
    });

    expenseForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = expenseDate.value;
      const category = document.getElementById('expenseCategory').value;
      const amount = parseFloat(document.getElementById('expenseAmount').value);
      const store = document.getElementById('expenseStore').value.trim();

      if (!category || !amount || !store) {
        alert('Please fill in all fields');
        return;
      }

      try {
        const { data: existingCategory } = await withRetry(() =>
          supabase.from('categories').select('id').eq('name', category).single()
        ).catch(() => ({ data: null }));

        if (!existingCategory) {
          await withRetry(() =>
            supabase.from('categories').insert([{ name: category }])
          );
        }

        await withRetry(() =>
          supabase.from('expenses').insert([{
            date,
            category,
            amount,
            store
          }])
        );

        alert(`$${amount.toFixed(2)} at ${store} has been successfully added`);
        document.getElementById('expenseAmount').value = '';
        document.getElementById('expenseStore').value = '';
        expenseDate.value = formatDate(selectedMonth);
        document.getElementById('expenseCategory').value = '';

        refreshDashboard();
      } catch (error) {
        console.error('Error adding expense:', error);
        alert('Error adding expense. Please try again.');
      }
    });

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        
        btn.classList.add('active');
        document.getElementById(tab + 'Tab').classList.add('active');

        if (tab === 'expense') {
          updateExpenseForm();
        }
      });
    });

    const allExpensesBtn = document.getElementById('allExpensesBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const allExpensesModal = document.getElementById('allExpensesModal');
    const closeAllExpensesBtn = document.getElementById('closeAllExpensesBtn');

    allExpensesBtn.addEventListener('click', async () => {
      modalOverlay.classList.add('active');
      allExpensesModal.classList.add('active');

      const expenses = await loadExpenses();
      
      if (expenses.length === 0) {
        document.getElementById('expensesList').innerHTML = '<div class="empty-state">No expenses for this month yet.</div>';
        return;
      }

      document.getElementById('expensesList').innerHTML = expenses.map(expense => `
        <div class="expense-row">
          <div class="expense-info">
            <div class="expense-store">${expense.store}</div>
            <div class="expense-meta">${new Date(expense.date + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} • ${expense.category}</div>
          </div>
          <div class="expense-amount">$${parseFloat(expense.amount).toFixed(2)}</div>
          <div class="expense-actions">
            <button class="icon-btn">✎</button>
            <button class="icon-btn" style="color: var(--danger);">🗑</button>
          </div>
        </div>
      `).join('');
    });

    closeAllExpensesBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      allExpensesModal.classList.remove('active');
    });

    const manageCategoriesBtn = document.getElementById('manageCategoriesBtn');
    const manageCategoriesModal = document.getElementById('manageCategoriesModal');
    const closeCategoriesBtn = document.getElementById('closeCategoriesBtn');

    manageCategoriesBtn.addEventListener('click', async () => {
      modalOverlay.classList.add('active');
      manageCategoriesModal.classList.add('active');
      await renderCategories();
    });

    closeCategoriesBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      manageCategoriesModal.classList.remove('active');
    });

    modalOverlay.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      allExpensesModal.classList.remove('active');
      manageCategoriesModal.classList.remove('active');
    });

    async function renderCategories() {
      try {
        const { data: categories } = await withRetry(() =>
          supabase.from('categories').select('*').order('name')
        );

        const { data: expenses } = await withRetry(() =>
          supabase.from('expenses').select('category')
        );

        const expenseCount = {};
        (expenses || []).forEach(e => {
          expenseCount[e.category] = (expenseCount[e.category] || 0) + 1;
        });

        if (!categories || categories.length === 0) {
          document.getElementById('categoriesList').innerHTML = '<div class="empty-state">No categories yet — add one below.</div>';
          return;
        }

        document.getElementById('categoriesList').innerHTML = categories.map(cat => `
          <div class="category-row">
            <div class="category-name">${cat.name}</div>
            <div class="category-count">${expenseCount[cat.name] || 0}</div>
            <div class="category-actions">
              <button class="icon-btn">✎</button>
              <button class="icon-btn" style="color: var(--danger);">🗑</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error rendering categories:', error);
      }
    }

    document.getElementById('addCategoryBtn').addEventListener('click', async () => {
      const name = document.getElementById('newCategoryInput').value.trim();
      if (!name) {
        alert('Please enter a category name');
        return;
      }

      try {
        await withRetry(() =>
          supabase.from('categories').insert([{ name }])
        );

        document.getElementById('newCategoryInput').value = '';
        await loadCategories();
        await renderCategories();
        refreshDashboard();
      } catch (error) {
        console.error('Error adding category:', error);
        alert('Category already exists or error occurred');
      }
    });

    // ===== INITIALIZE =====
    populateMonthSelector();
    loadCategories();
    updateExpenseForm();
    refreshDashboard();
  </script>
</body>
</html>
