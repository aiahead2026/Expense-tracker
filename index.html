<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ExpenseTracker">
  <meta name="theme-color" content="#171925">
  <title>ExpenseTracker</title>
  <style>
    :root {
      --primary: #9366ff;
      --primary-dark: #7247d9;
      --bg-primary: #171925;
      --bg-secondary: #242b3a;
      --bg-tertiary: #2d3647;
      --text-primary: #ffffff;
      --text-secondary: #a8aec0;
      --border: #3d4655;
      --success: #34c759;
      --danger: #ff453a;
      --warning: #ff9500;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); font-size: 16px; }

    /* LOGIN */
    .login-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .login-container.active { display: flex; }
    .login-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 40px 30px; width: 100%; max-width: 320px; text-align: center; }
    .login-logo { width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius: 12px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
    .login-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 30px; }
    .login-input { width: 100%; padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-size: 16px; margin-bottom: 16px; }
    .login-input:focus { outline: none; border-color: var(--primary); }
    .login-button { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
    .login-error { color: var(--danger); font-size: 14px; margin-bottom: 16px; display: none; }
    .login-error.show { display: block; }

    /* APP */
    .app-container { display: none; flex-direction: column; height: 100vh; background-color: var(--bg-primary); }
    .app-container.active { display: flex; }

    header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .logo-group { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: bold; }
    .logo-text { font-size: 16px; font-weight: 600; }
    .logout-btn { background: none; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; font-size: 12px; padding: 6px 12px; border-radius: 12px; }
    .month-selector { flex: 1; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-size: 14px; cursor: pointer; }
    .month-selector:focus { outline: none; border-color: var(--primary); }

    nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg-secondary); padding: 0 20px; }
    .tab-btn { flex: 1; padding: 14px 0; background: none; border: none; color: var(--text-secondary); font-size: 16px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--primary); }

    main { flex: 1; overflow-y: auto; padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }

    .total-amount { font-size: 42px; font-weight: 700; color: var(--primary); margin-bottom: 16px; text-align: center; }
    .pie-chart { text-align: center; margin-bottom: 20px; }
    canvas { max-width: 100%; height: auto; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); text-transform: uppercase; }
    .form-input, .form-select { width: 100%; padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-size: 16px; font-family: inherit; }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }

    .voice-group { display: flex; gap: 8px; align-items: flex-end; }
    .voice-group .form-input { flex: 1; margin-bottom: 0; }
    .voice-btn { padding: 12px 14px; background: var(--primary); border: none; border-radius: 12px; color: white; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .voice-btn.listening { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .voice-indicator { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    .warning { background: var(--bg-tertiary); border-left: 4px solid var(--warning); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--text-secondary); display: none; }
    .warning.show { display: block; }

    .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }

    .confirmation { text-align: center; display: none; }
    .confirmation.show { display: block; }
    .confirmation-banner { background: var(--bg-tertiary); border-left: 4px solid var(--success); border-radius: 12px; padding: 16px; margin-bottom: 32px; }
    .confirmation-amount { font-size: 32px; font-weight: 700; color: var(--success); margin-bottom: 8px; }

    .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .btn-pill { padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 20px; color: var(--text-primary); font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: none; z-index: 500; }
    .modal-overlay.active { display: block; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 600; overflow-y: auto; display: none; flex-direction: column; }
    .modal.active { display: flex; }
    .modal-header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; }
    .modal-title { font-size: 18px; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }
    .modal-content { flex: 1; padding: 20px; overflow-y: auto; }

    .expenses-list { display: flex; flex-direction: column; gap: 12px; }
    .expense-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .expense-info { flex: 1; }
    .expense-store { font-weight: 600; margin-bottom: 4px; }
    .expense-meta { font-size: 12px; color: var(--text-secondary); }
    .expense-amount { font-weight: 600; color: var(--primary); font-size: 16px; margin-right: 12px; }
    .expense-actions { display: flex; gap: 8px; }
    .icon-btn { background: none; border: 1px solid var(--border); border-radius: 6px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); }

    .category-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .category-name { flex: 1; font-weight: 600; }
    .category-count { font-size: 12px; color: var(--text-secondary); }
    .category-actions { display: flex; gap: 8px; margin-left: 12px; }

    .add-category-group { display: flex; gap: 8px; margin-top: 20px; }
    .add-category-group input { flex: 1; }
    .add-category-group button { padding: 10px 16px; background: var(--primary); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <div class="login-logo">💰</div>
      <h1 class="login-title">ExpenseTracker</h1>
      <p class="login-subtitle">Small steps, clear totals</p>
      <div class="login-error" id="loginError"></div>
      <input type="password" class="login-input" id="passwordInput" placeholder="Enter password" autocomplete="off">
      <button class="login-button" id="loginButton">Sign In</button>
    </div>
  </div>

  <!-- APP -->
  <div class="app-container" id="appContainer">
    <header>
      <div class="header-top">
        <div class="logo-group">
          <div class="logo-icon">💰</div>
          <div class="logo-text">ExpenseTracker</div>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
      <select class="month-selector" id="monthSelector"></select>
    </header>

    <nav>
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="expense">New expense</button>
    </nav>

    <main>
      <!-- DASHBOARD -->
      <div class="tab-content active" id="dashboardTab">
        <div class="card">
          <h2 class="card-title">Monthly summary</h2>
          <div class="total-amount" id="totalAmount">$0.00</div>
          <div class="pie-chart">
            <canvas id="pieChart"></canvas>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Category breakdown</h2>
          <div style="margin-bottom: 16px;">
            <select id="categoryBreakdownSelect" class="form-select"></select>
          </div>
          <div id="categoryBars"></div>
        </div>

        <div class="action-buttons">
          <button class="btn-pill" id="allExpensesBtn">All expenses</button>
          <button class="btn-pill" id="manageCategoriesBtn">Manage categories</button>
        </div>
      </div>

      <!-- NEW EXPENSE -->
      <div class="tab-content" id="expenseTab">
        <div class="card">
          <h2 class="card-title">New expense</h2>
          <div class="warning" id="dateWarning">🔒 You can only add expenses for the current month or up to 3 months prior.</div>
          <div class="confirmation" id="confirmationScreen">
            <div class="confirmation-banner">
              <div class="confirmation-amount" id="confirmAmount">$0.00</div>
              <p style="color: var(--text-secondary); font-size: 12px;">has been successfully added</p>
            </div>
            <button style="width:100%; padding:14px; background:var(--primary); border:none; border-radius:12px; color:white; font-weight:600; cursor:pointer;" id="addAnotherBtn">+ New expense</button>
          </div>

          <form id="expenseForm">
            <div class="form-group">
              <label class="form-label">Date</label>
              <input type="date" class="form-input" id="expenseDate" required>
            </div>
            <div class="form-group">
              <label class="form-label">Category</label>
              <select class="form-select" id="expenseCategory" required>
                <option value="">Select…</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Amount</label>
              <div class="voice-group">
                <input type="number" class="form-input" id="expenseAmount" placeholder="0.00" step="0.01" required>
                <button type="button" class="voice-btn" id="voiceAmountBtn">🎤</button>
              </div>
              <div class="voice-indicator" id="amountVoiceIndicator"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Store/Business</label>
              <div class="voice-group">
                <input type="text" class="form-input" id="expenseStore" placeholder="Where?" required>
                <button type="button" class="voice-btn" id="voiceStoreBtn">🎤</button>
              </div>
              <div class="voice-indicator" id="storeVoiceIndicator"></div>
            </div>
            <button type="submit" class="submit-btn">Add expense</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="allExpensesModal">
    <div class="modal-header">
      <h2 class="modal-title">All expenses</h2>
      <button class="close-btn" id="closeAllExpensesBtn">✕</button>
    </div>
    <div class="modal-content">
      <div class="expenses-list" id="expensesList"></div>
    </div>
  </div>

  <div class="modal" id="manageCategoriesModal">
    <div class="modal-header">
      <h2 class="modal-title">Manage categories</h2>
      <button class="close-btn" id="closeCategoriesBtn">✕</button>
    </div>
    <div class="modal-content">
      <div id="categoriesList"></div>
      <div class="add-category-group">
        <input type="text" class="form-input" id="newCategoryInput" placeholder="New category name">
        <button id="addCategoryBtn">Add</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    const SUPABASE_URL = 'https://drszqxwyyyyppajcqktp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyc3pxeHd5eXlwcGFqY3FrdHAiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcwNjI3OTk3OCwiZXhwIjoxODYzOTQ3OTc4fQ.n-Hmp_c7wQmR3S6lBh_q3hXR00Yl6O9hTMW4Ss85Z3o';
    const APP_PASSWORD = 'demo123';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let selectedMonth = new Date();
    let pieChart = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('voiceAmountBtn').style.display = 'none';
      document.getElementById('voiceStoreBtn').style.display = 'none';
    }

    // AUTH
    const loginContainer = document.getElementById('loginContainer');
    const appContainer = document.getElementById('appContainer');
    const passwordInput = document.getElementById('passwordInput');
    const loginButton = document.getElementById('loginButton');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    function checkAuth() {
      if (localStorage.getItem('expenseTrackerAuth') === 'true') showApp();
      else showLogin();
    }

    function showLogin() {
      loginContainer.classList.add('active');
      appContainer.classList.remove('active');
    }

    function showApp() {
      loginContainer.classList.remove('active');
      appContainer.classList.add('active');
      initializeApp();
    }

    loginButton.addEventListener('click', (e) => {
      e.preventDefault();
      if (passwordInput.value.trim() === APP_PASSWORD) {
        localStorage.setItem('expenseTrackerAuth', 'true');
        loginError.classList.remove('show');
        passwordInput.value = '';
        showApp();
      } else {
        loginError.textContent = 'Incorrect password';
        loginError.classList.add('show');
        passwordInput.focus();
      }
    });

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginButton.click();
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('expenseTrackerAuth');
      passwordInput.value = '';
      loginError.classList.remove('show');
      showLogin();
      passwordInput.focus();
    });

    // HELPERS
    async function withRetry(fn, max = 3) {
      for (let i = 0; i < max; i++) {
        try { return await fn(); }
        catch (e) { if (i === max - 1) throw e; await new Promise(r => setTimeout(r, Math.pow(2, i) * 100)); }
      }
    }

    function getMonthKey(d) { return d.toISOString().slice(0, 7); }
    function formatDate(d) { return d.toISOString().split('T')[0]; }

    function canEditMonth(d) {
      const today = new Date();
      const threeMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 3, today.getDate());
      return d >= threeMonthsAgo && d <= today;
    }

    // MONTH SELECTOR
    const monthSelector = document.getElementById('monthSelector');

    function populateMonthSelector() {
      monthSelector.innerHTML = '';
      const today = new Date();
      for (let i = 0; i <= 3; i++) {
        const date = new Date(today.getFullYear(), today.getMonth() - i, 1);
        const opt = document.createElement('option');
        opt.value = getMonthKey(date);
        opt.textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
        if (i === 0) opt.selected = true;
        monthSelector.appendChild(opt);
      }
    }

    monthSelector.addEventListener('change', (e) => {
      const [y, m] = e.target.value.split('-').map(Number);
      selectedMonth = new Date(y, m - 1, 1);
      refreshDashboard();
      updateForm();
    });

    // FORM
    const expenseForm = document.getElementById('expenseForm');
    const expenseDate = document.getElementById('expenseDate');
    const expenseCategory = document.getElementById('expenseCategory');
    const expenseAmount = document.getElementById('expenseAmount');
    const expenseStore = document.getElementById('expenseStore');
    const dateWarning = document.getElementById('dateWarning');
    const confirmationScreen = document.getElementById('confirmationScreen');

    function updateForm() {
      const canEdit = canEditMonth(selectedMonth);
      expenseForm.style.display = canEdit ? 'block' : 'none';
      confirmationScreen.classList.remove('show');
      dateWarning.classList.toggle('show', !canEdit);
      if (canEdit) expenseDate.value = formatDate(selectedMonth);
    }

    // VOICE
    function setupVoice(btn, inp, ind) {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!SpeechRecognition || isListening) return;

        const rec = new SpeechRecognition();
        rec.lang = 'en-US';
        btn.classList.add('listening');
        btn.disabled = true;
        isListening = true;
        ind.textContent = '🎤 Listening...';

        rec.onresult = (ev) => {
          const txt = ev.results[0][0].transcript.trim();
          if (inp === expenseAmount) {
            const num = txt.match(/\d+\.?\d*/);
            if (num) {
              inp.value = num[0];
              ind.textContent = `✓ $${num[0]}`;
            } else ind.textContent = '❌ No number';
          } else {
            inp.value = txt;
            ind.textContent = `✓ ${txt}`;
          }
        };

        rec.onerror = (ev) => { ind.textContent = `❌ ${ev.error}`; };
        rec.onend = () => {
          btn.classList.remove('listening');
          btn.disabled = false;
          isListening = false;
          setTimeout(() => { ind.textContent = ''; }, 3000);
        };

        rec.start();
      });
    }

    setupVoice(document.getElementById('voiceAmountBtn'), expenseAmount, document.getElementById('amountVoiceIndicator'));
    setupVoice(document.getElementById('voiceStoreBtn'), expenseStore, document.getElementById('storeVoiceIndicator'));

    // SUBMIT
    expenseForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = expenseDate.value;
      const category = expenseCategory.value;
      const amount = parseFloat(expenseAmount.value);
      const store = expenseStore.value.trim();

      if (!category || !amount || !store) { alert('Fill all fields'); return; }

      try {
        const { data: cat } = await withRetry(() => supabase.from('categories').select('id').eq('name', category).single()).catch(() => ({ data: null }));
        if (!cat) await withRetry(() => supabase.from('categories').insert([{ name: category }]));
        await withRetry(() => supabase.from('expenses').insert([{ date, category, amount, store }]));

        document.getElementById('confirmAmount').textContent = `$${amount.toFixed(2)}`;
        confirmationScreen.classList.add('show');
        expenseForm.style.display = 'none';
        expenseAmount.value = '';
        expenseStore.value = '';
        expenseDate.value = formatDate(selectedMonth);
        expenseCategory.value = '';
        refreshDashboard();
      } catch (e) { alert('Error adding expense'); }
    });

    document.getElementById('addAnotherBtn').addEventListener('click', () => {
      confirmationScreen.classList.remove('show');
      expenseForm.style.display = 'block';
      expenseAmount.focus();
    });

    // TABS
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(tab + 'Tab').classList.add('active');
        if (tab === 'expense') updateForm();
      });
    });

    // LOAD
    async function loadCategories() {
      try {
        const { data } = await withRetry(() => supabase.from('categories').select('*').order('name'));
        expenseCategory.innerHTML = '<option value="">Select…</option>';
        document.getElementById('categoryBreakdownSelect').innerHTML = '';
        (data || []).forEach(c => {
          const o1 = document.createElement('option');
          o1.value = c.name;
          o1.textContent = c.name;
          expenseCategory.appendChild(o1);

          const o2 = document.createElement('option');
          o2.value = c.name;
          o2.textContent = c.name;
          document.getElementById('categoryBreakdownSelect').appendChild(o2);
        });
        if (data && data[0]) document.getElementById('categoryBreakdownSelect').value = data[0].name;
      } catch (e) { console.error(e); }
    }

    async function loadExpenses() {
      try {
        const key = getMonthKey(selectedMonth);
        const { data } = await withRetry(() => supabase.from('expenses').select('*').ilike('date', key + '%').order('date', { ascending: false }));
        return data || [];
      } catch (e) { return []; }
    }

    async function refreshDashboard() {
      try {
        const exp = await loadExpenses();
        const total = exp.reduce((s, e) => s + parseFloat(e.amount), 0);
        document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;

        const byCategory = {};
        exp.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + parseFloat(e.amount); });

        const ctx = document.getElementById('pieChart').getContext('2d');
        if (pieChart) pieChart.destroy();

        if (Object.keys(byCategory).length === 0) {
          ctx.clearRect(0, 0, 300, 300);
          document.getElementById('categoryBars').innerHTML = '<div class="empty-state"><p>No expenses in this category for this month.</p></div>';
        } else {
          pieChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: Object.keys(byCategory),
              datasets: [{ data: Object.values(byCategory), backgroundColor: ['#9366ff', '#7247d9', '#a77ef0', '#82ffff', '#00d4ff', '#00b8e6', '#34c759', '#30b0c0', '#ff9500', '#ff453a'], borderColor: '#242b3a', borderWidth: 2 }]
            },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'right', labels: { color: '#a8aec0', font: { size: 12 }, padding: 12, usePointStyle: true } } } }
          });

          updateBreakdown(exp);
        }
      } catch (e) { console.error(e); }
    }

    function updateBreakdown(exp) {
      const cat = document.getElementById('categoryBreakdownSelect').value;
      const catExp = exp.filter(e => e.category === cat);

      if (catExp.length === 0) {
        document.getElementById('categoryBars').innerHTML = '<div class="empty-state"><p>No expenses in this category for this month.</p></div>';
        return;
      }

      const byStore = {};
      catExp.forEach(e => { byStore[e.store] = (byStore[e.store] || 0) + parseFloat(e.amount); });

      const total = Object.values(byStore).reduce((a, b) => a + b, 0);
      const stores = Object.entries(byStore).sort((a, b) => b[1] - a[1]);

      document.getElementById('categoryBars').innerHTML = stores.map(([store, amount]) => {
        const pct = ((amount / total) * 100).toFixed(0);
        const mw = (amount / Math.max(...Object.values(byStore))) * 50;
        return `<div style="display:flex;align-items:center;margin-bottom:14px;gap:10px;"><div style="min-width:80px;font-size:13px;color:#a8aec0;">${store}</div><div style="flex:1;height:24px;background:#2d3647;border-radius:6px;"><div style="height:100%;background:linear-gradient(90deg,#9366ff,#7247d9);border-radius:6px;width:${mw}%;max-width:50%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;"><div style="font-size:11px;color:white;font-weight:600;">$${amount.toFixed(2)}</div></div></div><div style="min-width:45px;text-align:right;font-size:13px;color:#a8aec0;">${pct}%</div></div>`;
      }).join('');
    }

    document.getElementById('categoryBreakdownSelect').addEventListener('change', async () => {
      const exp = await loadExpenses();
      updateBreakdown(exp);
    });

    // ALL EXPENSES
    const allExpensesBtn = document.getElementById('allExpensesBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const allExpensesModal = document.getElementById('allExpensesModal');

    allExpensesBtn.addEventListener('click', async () => {
      modalOverlay.classList.add('active');
      allExpensesModal.classList.add('active');
      const exp = await loadExpenses();
      if (exp.length === 0) {
        document.getElementById('expensesList').innerHTML = '<div class="empty-state"><p>No expenses for this month yet.</p></div>';
      } else {
        document.getElementById('expensesList').innerHTML = exp.map((e, i) => `<div class="expense-row"><div class="expense-info"><div class="expense-store">${e.store}</div><div class="expense-meta">${new Date(e.date + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} • ${e.category}</div></div><div class="expense-amount">$${parseFloat(e.amount).toFixed(2)}</div><div class="expense-actions"><button class="icon-btn">✎</button><button class="icon-btn" onclick="alert('Delete feature - implement as needed')" style="color:#ff453a;">🗑</button></div></div>`).join('');
      }
    });

    document.getElementById('closeAllExpensesBtn').addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      allExpensesModal.classList.remove('active');
    });

    // MANAGE CATEGORIES
    const manageCategoriesBtn = document.getElementById('manageCategoriesBtn');
    const manageCategoriesModal = document.getElementById('manageCategoriesModal');

    manageCategoriesBtn.addEventListener('click', async () => {
      modalOverlay.classList.add('active');
      manageCategoriesModal.classList.add('active');
      await renderCategories();
    });

    document.getElementById('closeCategoriesBtn').addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      manageCategoriesModal.classList.remove('active');
    });

    modalOverlay.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      allExpensesModal.classList.remove('active');
      manageCategoriesModal.classList.remove('active');
    });

    async function renderCategories() {
      try {
        const { data: cats } = await withRetry(() => supabase.from('categories').select('*').order('name'));
        const { data: exps } = await withRetry(() => supabase.from('expenses').select('category'));
        const cnt = {};
        (exps || []).forEach(e => { cnt[e.category] = (cnt[e.category] || 0) + 1; });

        if (!cats || cats.length === 0) {
          document.getElementById('categoriesList').innerHTML = '<div class="empty-state"><p>No categories yet — add one below.</p></div>';
        } else {
          document.getElementById('categoriesList').innerHTML = cats.map(c => `<div class="category-row"><div class="category-name">${c.name}</div><div class="category-count">${cnt[c.name] || 0}</div><div class="category-actions"><button class="icon-btn">✎</button><button class="icon-btn" onclick="alert('Delete feature - implement as needed')" style="color:#ff453a;">🗑</button></div></div>`).join('');
        }
      } catch (e) { console.error(e); }
    }

    document.getElementById('addCategoryBtn').addEventListener('click', async () => {
      const name = document.getElementById('newCategoryInput').value.trim();
      if (!name) { alert('Enter category name'); return; }
      try {
        await withRetry(() => supabase.from('categories').insert([{ name }]));
        document.getElementById('newCategoryInput').value = '';
        await loadCategories();
        await renderCategories();
        refreshDashboard();
      } catch (e) { alert('Category exists or error'); }
    });

    async function initializeApp() {
      populateMonthSelector();
      await loadCategories();
      updateForm();
      refreshDashboard();
    }

    checkAuth();
  </script>
</body>
</html>
